server {
    listen 80;
    server_name avinashgupta.in www.avinashgupta.in;

    # Small API proxies (PM2 services on this machine). The trailing slash on
    # proxy_pass strips the /api/<name>/ prefix.
    location /api/leetcode/ {
        proxy_pass         http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /api/github/ {
        proxy_pass         http://127.0.0.1:4002/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location / {
        proxy_pass         http://localhost:6012;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
