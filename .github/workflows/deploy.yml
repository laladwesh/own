name: Deploy Portfolio

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            if [ ! -d ~/portfolio ]; then
              git clone https://github.com/laladwesh/own.git ~/portfolio
            fi
            cd ~/portfolio
            echo "Pulling latest changes..."
            git fetch origin
            git reset --hard origin/master
            git clean -fd

            echo "Installing dependencies..."
            npm install

            echo "Building..."
            npm run build

            echo "Serving dist/ on port 6012 (static server that knows the prerendered pages)..."
            # One-time migration: the old `pm2 serve --spa` process (named "portfolio") cannot
            # serve /incidents/..., and it holds port 6012. Remove it if it is still there.
            pm2 describe portfolio > /dev/null 2>&1 && pm2 delete portfolio || true
            pm2 describe portfolio-static > /dev/null 2>&1 \
              && pm2 reload portfolio-static \
              || pm2 start server/static/ecosystem.config.cjs

            echo "Deploying leetcode-api proxy..."
            cd server/leetcode-api
            npm install --production
            cd ~/portfolio
            pm2 describe leetcode-api > /dev/null 2>&1 \
              && pm2 reload leetcode-api \
              || pm2 start server/leetcode-api/ecosystem.config.cjs

            echo "Deploying presence-api (visitor presence over Socket.IO)..."
            cd server/presence-api
            npm install --production
            cd ~/portfolio
            pm2 describe presence-api > /dev/null 2>&1 \
              && pm2 reload presence-api \
              || pm2 start server/presence-api/ecosystem.config.cjs

            echo "Deploying status-api (health checks for the status rack)..."
            pm2 describe status-api > /dev/null 2>&1 \
              && pm2 reload status-api \
              || pm2 start server/status-api/ecosystem.config.cjs

            echo "Deploying github-api proxy (token stays on the server)..."
            cd server/github-api
            npm install --production
            # Only write the token when the secret has a value. An empty secret used to blank
            # the working .env on every deploy; now the token already on the server is kept.
            if [ -n "${{ secrets.GH_API_TOKEN }}" ]; then
              ( umask 077; echo "GITHUB_TOKEN=${{ secrets.GH_API_TOKEN }}" > .env )
            else
              echo "WARNING: GH_API_TOKEN secret is empty; keeping the existing server/github-api/.env"
            fi
            cd ~/portfolio
            pm2 describe github-api > /dev/null 2>&1 \
              && pm2 reload github-api --update-env \
              || pm2 start server/github-api/ecosystem.config.cjs

            pm2 save

            echo "Deployment completed successfully!"
